# thing types

thing-type.bluetooth.directbt.label = Direct-BT Bluetooth Adapter
thing-type.bluetooth.directbt.description = A Bluetooth adapter driven directly via the Direct-BT userspace stack (no BlueZ daemon). Takes exclusive control of the adapter; bluetoothd must be disabled for that adapter.

# thing types config

thing-type.config.bluetooth.directbt.address.label = Address
thing-type.config.bluetooth.directbt.address.description = The Bluetooth address of the adapter in format XX:XX:XX:XX:XX:XX
thing-type.config.bluetooth.directbt.backgroundDiscovery.label = Background Discovery
thing-type.config.bluetooth.directbt.backgroundDiscovery.description = Whether this adapter performs background discovery of Bluetooth devices
thing-type.config.bluetooth.directbt.inactiveDeviceCleanupInterval.label = Device Cleanup Interval
thing-type.config.bluetooth.directbt.inactiveDeviceCleanupInterval.description = How often device cleanup is performed
thing-type.config.bluetooth.directbt.inactiveDeviceCleanupThreshold.label = Device Cleanup Threshold
thing-type.config.bluetooth.directbt.inactiveDeviceCleanupThreshold.description = Timespan a device can remain radio silent before it is eligible for cleanup
