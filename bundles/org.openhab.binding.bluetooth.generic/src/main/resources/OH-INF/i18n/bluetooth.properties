# thing types

thing-type.bluetooth.generic.label = Generic Bluetooth Device
thing-type.bluetooth.generic.description = A generic bluetooth device that supports GATT characteristics

# thing types config

thing-type.config.bluetooth.generic.address.label = Address
thing-type.config.bluetooth.generic.address.description = Bluetooth address in XX:XX:XX:XX:XX:XX format
thing-type.config.bluetooth.generic.alwaysConnected.label = Connect Automatically
thing-type.config.bluetooth.generic.alwaysConnected.description = If enabled, will automatically connect to the device and reconnect if connection is lost.
thing-type.config.bluetooth.generic.connectionSecurity.label = Connection Security
thing-type.config.bluetooth.generic.connectionSecurity.description = LE connection security for this device (honoured by transports that support it, e.g. the Direct-BT adapter).<br/> <b>None</b>: unencrypted connection (default).<br/> <b>Encrypted</b>: request an encrypted link (Just-Works pairing, no PIN). Strict: never falls back to an unencrypted connection.<br/> <b>PIN</b>: encrypted and authenticated link (Passkey Entry) using the configured Passkey. Strict: the connection is refused rather than downgraded if the device cannot pair authenticated.
thing-type.config.bluetooth.generic.connectionSecurity.option.none = None
thing-type.config.bluetooth.generic.connectionSecurity.option.encrypted = Encrypted
thing-type.config.bluetooth.generic.connectionSecurity.option.pin = PIN
thing-type.config.bluetooth.generic.gattCache.label = Fast Reconnect
thing-type.config.bluetooth.generic.gattCache.description = Remembers the device's capability layout between connections so reconnects skip the slow rediscovery step (seconds faster). Nothing is stored on disk; the memory lasts until openHAB restarts. Only effective on transports that support it (e.g. Direct-BT).<br/> <b>Enabled - verified</b>: re-checks the layout against the device on every reconnect; safe for every device (default).<br/> <b>Enabled - trusted</b>: reuses the remembered layout without checking; fastest, but if the device's firmware is updated it can silently read the wrong values until openHAB restarts. Only for devices whose firmware never changes.<br/> <b>Disabled</b>: full rediscovery on every reconnect (troubleshooting).
thing-type.config.bluetooth.generic.gattCache.option.auto = Enabled - verified each reconnect (recommended)
thing-type.config.bluetooth.generic.gattCache.option.trust = Enabled - trust remembered layout (fastest)
thing-type.config.bluetooth.generic.gattCache.option.off = Disabled - full rediscovery every time
thing-type.config.bluetooth.generic.passkey.label = Passkey
thing-type.config.bluetooth.generic.passkey.description = The device's fixed 6-digit pairing PIN (0..999999), used when Connection Security is PIN.
thing-type.config.bluetooth.generic.pollingInterval.label = Polling Interval
thing-type.config.bluetooth.generic.pollingInterval.description = The frequency at which readable characteristics refreshed

# channel types

channel-type.bluetooth.char-unknown.label = Unknown Bluetooth Characteristic
channel-type.bluetooth.char-unknown.description = The raw value of unknown characteristics are represented with hexadecimal

binding.config.bluetooth.generic.gattExtensionsFolder.label = Custom GATT Extensions Folder
binding.config.bluetooth.generic.gattExtensionsFolder.description = Folder containing custom GATT specification XML files for non-standard services and characteristics, letting the generic Bluetooth handler recognise them and expose typed channels instead of raw hexadecimal. The folder must contain "characteristic" and/or "service" sub-folders with XML files in the Bluetooth SIG GATT XML format. A relative path is resolved against the openHAB configuration folder (portable across operating systems); an absolute path is used as-is. Defaults to "gatt-extensions" under the configuration folder.
binding.config.bluetooth.generic.pollOnlyLinkedCharacteristics.label = Poll Only Linked Characteristics
binding.config.bluetooth.generic.pollOnlyLinkedCharacteristics.description = When enabled (default), the generic handler only reads and enables notifications for characteristics whose channel has a linked item, instead of polling every readable characteristic. This avoids unnecessary GATT traffic on the device. Disable to restore the legacy behaviour of polling all readable characteristics regardless of item links.
binding.config.bluetooth.generic.reconnectOnUnresolvedServices.label = Reconnect On Unresolved Services
binding.config.bluetooth.generic.reconnectOnUnresolvedServices.description = When enabled (default), a connection that is up at the link level but has not resolved its GATT services is recovered with a reconnect that preserves the connection intent, instead of a plain disconnect. This prevents a connect/disconnect flap on transports that track connection intent (e.g. Direct-BT keeping an always-connected device connected). Disable to restore the legacy behaviour of disconnecting on unresolved services.
